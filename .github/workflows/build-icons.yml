name: Build FilmTone app icons
on:
  push:
    paths:
      - 'icons/filmtone-source.svg'
      - '.github/workflows/build-icons.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install cairosvg
      - name: Generate icons
        run: |
          python - <<'PY'
          import cairosvg
          for size in (192,512):
              cairosvg.svg2png(url="icons/filmtone-source.svg",write_to=f"icons/icon-{size}.png",output_width=size,output_height=size)
          PY
      - name: Commit icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icons/icon-192.png icons/icon-512.png
          if ! git diff --cached --quiet; then git commit -m "Refresh FilmTone Android and iOS icons"; git push; fi
